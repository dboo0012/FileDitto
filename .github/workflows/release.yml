name: "publish"

on:
  workflow_dispatch:
  push:
    branches:
      - release
env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Get version from tag or input
      #   id: get-version
      #   run: |
      #     if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
      #       echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
      #     else
      #       echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      #     fi

      - name: Create Release
        id: create-release
        uses: comnoco/create-release-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.release.tag_name }}
          release_name: FileDitto v${{ github.event.release.tag_name }}
          draft: false
          prerelease: false
          body: |
            ## FileDitto v${{ github.event.release.tag_name }}

            ### Downloads

            | Platform | Download |
            |----------|----------|
            | Windows (64-bit) | [FileDitto_${{ github.event.release.tag_name }}_x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/v${{ github.event.release.tag_name }}/FileDitto_${{ github.event.release.tag_name }}_x64-setup.exe) |
            | Windows MSI | [FileDitto_${{ github.event.release.tag_name }}_x64_en-US.msi](https://github.com/${{ github.repository }}/releases/download/v${{ github.event.release.tag_name }}/FileDitto_${{ github.event.release.tag_name }}_x64_en-US.msi) |
            | macOS (Apple Silicon) | [FileDitto_${{ github.event.release.tag_name }}_aarch64.dmg](https://github.com/${{ github.repository }}/releases/download/v${{ github.event.release.tag_name }}/FileDitto_${{ github.event.release.tag_name }}_aarch64.dmg) |
            | macOS (Intel) | [FileDitto_${{ github.event.release.tag_name }}_x64.dmg](https://github.com/${{ github.repository }}/releases/download/v${{ github.event.release.tag_name }}/FileDitto_${{ github.event.release.tag_name }}_x64.dmg) |
            | Linux (64-bit) | [FileDitto_${{ github.event.release.tag_name }}_amd64.deb](https://github.com/${{ github.repository }}/releases/download/v${{ github.event.release.tag_name }}/fileditto_${{ github.event.release.tag_name }}_amd64.deb) |
            | Linux AppImage | [FileDitto_${{ github.event.release.tag_name }}_amd64.AppImage](https://github.com/${{ github.repository }}/releases/download/v${{ github.event.release.tag_name }}/fileditto_${{ github.event.release.tag_name }}_amd64.AppImage) |

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Import Windows certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -path certificate -include tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: install app dependencies and build it
        run: npm ci

      # Download and setup FFmpeg binaries for each platform
      - name: Setup FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          # Check if ffmpeg binaries already exist
          if (!(Test-Path "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe")) {
            Write-Host "Downloading FFmpeg for Windows..."
            $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
            Invoke-WebRequest -Uri $ffmpegUrl -OutFile "ffmpeg.zip"
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp"
            $ffmpegDir = Get-ChildItem -Path "ffmpeg-temp" -Directory | Select-Object -First 1
            Copy-Item "$($ffmpegDir.FullName)/bin/ffmpeg.exe" "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
            Copy-Item "$($ffmpegDir.FullName)/bin/ffprobe.exe" "src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe"
            Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg-temp"
          }

      - name: Setup FFmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ffmpeg
          mkdir -p src-tauri/binaries
          # Copy ffmpeg binaries with correct naming for Tauri
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            cp $(which ffmpeg) src-tauri/binaries/ffmpeg-aarch64-apple-darwin
            cp $(which ffprobe) src-tauri/binaries/ffprobe-aarch64-apple-darwin
          else
            cp $(which ffmpeg) src-tauri/binaries/ffmpeg-x86_64-apple-darwin
            cp $(which ffprobe) src-tauri/binaries/ffprobe-x86_64-apple-darwin
          fi
          chmod +x src-tauri/binaries/*

      - name: Setup FFmpeg (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y ffmpeg
          mkdir -p src-tauri/binaries
          cp $(which ffmpeg) src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp $(which ffprobe) src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*

      - name: Building the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows signing (optional - set in GitHub Secrets)
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # macOS signing (optional - set in GitHub Secrets)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing (optional - set in GitHub Secrets)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
