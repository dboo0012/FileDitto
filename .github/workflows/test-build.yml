name: Test Build

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - test-build

env:
  CARGO_TERM_COLOR: always

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Download and setup FFmpeg binaries for each platform
      - name: Setup FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          if (!(Test-Path "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe")) {
            Write-Host "Downloading FFmpeg for Windows..."
            $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gp  l.zip"
            Invoke-WebRequest -Uri $ffmpegUrl -OutFile "ffmpeg.zip"
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp"
            $ffmpegDir = Get-ChildItem -Path "ffmpeg-temp" -Directory | Select-Object -First 1
            Copy-Item "$($ffmpegDir.FullName)/bin/ffmpeg.exe" "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
            Copy-Item "$($ffmpegDir.FullName)/bin/ffprobe.exe" "src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe"
            Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg-temp"
          }

      - name: Setup FFmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ffmpeg
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            cp $(which ffmpeg) src-tauri/binaries/ffmpeg-aarch64-apple-darwin
            cp $(which ffprobe) src-tauri/binaries/ffprobe-aarch64-apple-darwin
          else
            cp $(which ffmpeg) src-tauri/binaries/ffmpeg-x86_64-apple-darwin
            cp $(which ffprobe) src-tauri/binaries/ffprobe-x86_64-apple-darwin
          fi
          chmod +x src-tauri/binaries/*

      - name: Setup FFmpeg (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y ffmpeg
          mkdir -p src-tauri/binaries
          cp $(which ffmpeg) src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp $(which ffprobe) src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
